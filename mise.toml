# Toolchain, installed with `mise install`. Keep gradle in step with the wrapper.
[tools]
java = "temurin-21"
gradle = "9.8.2"
kotlin = "2.4.21"  # runs ci.main.kts

[tasks.start]
description = "Start ControlLima on http://127.0.0.1:8787 and open the browser"
run = "./gradlew :cli:run --args='--open'"

[tasks.ci]
description = "Regenerate .github/workflows from ci.main.kts"
run = "kotlin ci.main.kts"
